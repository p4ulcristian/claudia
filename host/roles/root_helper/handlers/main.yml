---
# Handlers run in this order: systemd reads the units before the helper restarts.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Make the root helper's socket folders
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/claudia-root.conf
  changed_when: true

- name: Restart the root helper
  ansible.builtin.systemd_service:
    name: claudia-root.service
    state: restarted

- name: Restart the front
  ansible.builtin.systemd:
    name: claudia-front.service
    state: restarted
