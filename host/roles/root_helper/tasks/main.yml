---
# The root helper (README decision 52): its no-tap list, its socket folders, its unit, and the sudo
# shim that agents meet first on their PATH. The helper (out/root.js) and the shim
# (deploy/sudo-shim) come with Claudia's release in /srv/claudia; this role only wires them up.

- name: Install the no-tap list (exact command lines the helper runs without asking)
  ansible.builtin.template:
    src: root-no-tap.j2
    dest: "{{ root_no_tap_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Describe the socket folders (one per agent user) to systemd-tmpfiles
  ansible.builtin.template:
    src: claudia-root-tmpfiles.conf.j2
    dest: /etc/tmpfiles.d/claudia-root.conf
    owner: root
    group: root
    mode: "0644"
  notify: Make the root helper's socket folders

- name: Install the root helper's unit
  ansible.builtin.template:
    src: claudia-root.service.j2
    dest: /etc/systemd/system/claudia-root.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Make the folder whose sudo comes first on the agents' PATH
  ansible.builtin.file:
    path: "{{ agent_bin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The shim may not be there yet (another release brings it); the link is made all the same and
# works from the release that has it.
- name: Point sudo there at the shim
  ansible.builtin.file:
    src: "{{ sudo_shim }}"
    dest: "{{ agent_bin_dir }}/sudo"
    state: link
    force: true
    follow: false

- name: Put the shim first for agent users' login shells too (SSH arrivals)
  ansible.builtin.template:
    src: claudia-agent-path.sh.j2
    dest: /etc/profile.d/claudia-agent-path.sh
    owner: root
    group: root
    mode: "0644"

# Only for profiles that already run as their agent user: a person's own user cannot enter an agent
# user's socket folder, so the shim would break sudo for a profile not moved yet. Role migrate
# writes it for the profiles it moves.
- name: Put the shim first on the PATH of each moved profile's session host
  ansible.builtin.include_tasks: agent_path.yml
  loop: "{{ people }}"
  loop_control:
    loop_var: root_helper_person
    label: "{{ root_helper_person.profile }}"
  when: profile_users[root_helper_person.profile] | default('') == root_helper_person.profile ~ agent_suffix

- name: Apply the changed units now
  ansible.builtin.meta: flush_handlers

- name: See whether the release brings the helper yet
  ansible.builtin.stat:
    path: /srv/claudia/out/root.js
  register: root_helper_root_js

- name: Enable the root helper (and start it when the release has out/root.js)
  ansible.builtin.systemd_service:
    name: claudia-root.service
    enabled: true
    state: "{{ 'started' if root_helper_root_js.stat.exists else omit }}"
