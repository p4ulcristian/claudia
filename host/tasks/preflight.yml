---
# Checks and facts before anything changes. Nothing here writes to the server.

- name: Stop unless the settings are complete and sane
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Linux'
      - people is defined and people | length > 0
      - break_glass_pubkey is defined and break_glass_pubkey is match('^(ssh-ed25519|ecdsa-sha2-|sk-|ssh-rsa) ')
      - "'placeholder' not in break_glass_pubkey"
      - claudia_ssh_ca_pubkey is defined and claudia_ssh_ca_pubkey is match('^(ssh-ed25519|ecdsa-sha2-|ssh-rsa) ')
      - "'placeholder' not in claudia_ssh_ca_pubkey"
      - migrate_profiles | difference(people | map(attribute='profile')) | length == 0
    fail_msg: >-
      Needs `people` for this host, real `break_glass_pubkey` and `claudia_ssh_ca_pubkey` (not the
      example's placeholders), and every name in `migrate_profiles` among the people's profiles.

- name: Stop unless every profile name makes a valid agent user name
  ansible.builtin.assert:
    that:
      - item.profile is match('^[a-z][a-z0-9-]*$')
      - (item.profile ~ agent_suffix) | length <= 32
      - item.person_user is defined and item.person_user | length > 0
    fail_msg: "Profile {{ item.profile }}: lowercase letters, digits and '-', and <profile>{{ agent_suffix }} at most 32 characters."
  loop: "{{ people }}"
  loop_control:
    label: "{{ item.profile }}"

- name: Read the Linux users
  ansible.builtin.getent:
    database: passwd

- name: Stop unless every person's own Linux user exists
  ansible.builtin.assert:
    that: item.person_user in ansible_facts.getent_passwd
    fail_msg: "Person user {{ item.person_user }} (profile {{ item.profile }}) does not exist on this server."
  loop: "{{ people }}"
  loop_control:
    label: "{{ item.person_user }}"

- name: Read Claudia's profiles file
  ansible.builtin.slurp:
    src: /etc/claudia/profiles
  register: profiles_file
  failed_when: false

# profile_users: each profile's current Linux user, read the way deploy/shared-server/install.sh
# reads it: `user=<name>` among the 4th and later words of the profile's line, else claudia-<profile>.
- name: Work out whom each profile runs as now
  ansible.builtin.set_fact:
    profile_users: >-
      {%- set ns = namespace(pairs=[]) -%}
      {%- for line in ((profiles_file.content | default('')) | b64decode).splitlines() -%}
      {%-   set words = (line.split('#') | first).split() -%}
      {%-   if words | length >= 3 -%}
      {%-     set named = words[3:] | select('match', '^user=.') | map('regex_replace', '^user=', '') | list -%}
      {%-     set ns.pairs = ns.pairs + [{'key': words[0], 'value': (named | first) if named else 'claudia-' ~ words[0]}] -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.pairs | items2dict }}

- name: Name the agent users and the people's users
  ansible.builtin.set_fact:
    agent_users: "{{ people | map(attribute='profile') | map('regex_replace', '$', agent_suffix) | list }}"
    person_users: "{{ people | map(attribute='person_user') | unique | list }}"
