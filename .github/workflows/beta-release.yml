# Claudia beta follows its branch by itself (README decision 11). On every push to beta:
# - slave: all five builds, then the slave release (out/, production node_modules for linux-x64,
#   deploy/, package.json, commit.txt) as claudia-beta-slave-<commit>.tar.gz on the GitHub release
#   beta-<short commit>, with its cosign keyless signature bundle (<file>.sigstore.json).
#   deploy/update.sh on each server verifies that bundle against this workflow on beta.
# - hub-image: the hub's image (deploy/hub.Dockerfile) to GHCR as claudia-beta-hub:sha-<commit>,
#   signed keyless with cosign. The gate's update helper verifies it the same way.
# GitHub's webhook for this run finishing makes the hub ask the gate to update it and poke every
# server again (src/claudia/hub/github.cljs).
name: beta-release

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/claudia-beta-hub
  IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/beta-release.yml@refs/heads/beta
  ISSUER: https://token.actions.githubusercontent.com

jobs:
  slave:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the release
      id-token: write   # cosign keyless signing through GitHub OIDC
    steps:
      # Every action is pinned to a commit SHA, not a tag: tags can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # shadow-cljs compiles on the JVM.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Build (host runner front hub web)
        run: |
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          npx shadow-cljs release host runner front hub web
          npm run build:web-files

      - name: Pack the slave release
        id: pack
        run: |
          name="claudia-beta-slave-${GITHUB_SHA}.tar.gz"
          mkdir -p dist/pkg
          cp -r out deploy package.json package-lock.json dist/pkg/
          echo "$GITHUB_SHA" > dist/pkg/commit.txt
          (cd dist/pkg && npm ci --omit=dev --ignore-scripts --no-audit --no-fund && rm package-lock.json)
          tar -czf "dist/$name" -C dist/pkg .
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign
        run: cosign sign-blob --yes --bundle "dist/${{ steps.pack.outputs.name }}.sigstore.json" "dist/${{ steps.pack.outputs.name }}"

      # Verified against the exact identity deploy/update.sh trusts: this workflow, on beta.
      - name: Verify signature
        if: github.ref == 'refs/heads/beta'
        run: |
          cosign verify-blob --bundle "dist/${{ steps.pack.outputs.name }}.sigstore.json" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
            "dist/${{ steps.pack.outputs.name }}"

      - name: Publish the release
        if: github.ref == 'refs/heads/beta'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="beta-${GITHUB_SHA::7}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Claudia beta ${GITHUB_SHA::7}" --notes "Slave release of beta at ${GITHUB_SHA}, signed by this repository's beta-release workflow." \
            "dist/${{ steps.pack.outputs.name }}" "dist/${{ steps.pack.outputs.name }}.sigstore.json"
          echo "release: $tag" >> "$GITHUB_STEP_SUMMARY"

  hub-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # cosign keyless signing through GitHub OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/hub.Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          # Links the package to this repository (its page, its permissions).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=beta-hub
          cache-to: type=gha,scope=beta-hub,mode=max
          provenance: mode=min
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

      - name: Verify signature
        if: github.ref == 'refs/heads/beta'
        run: |
          cosign verify "${IMAGE}@${{ steps.push.outputs.digest }}" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" > /dev/null
          echo "image: ${IMAGE}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
