# Claudia's builds, signed and published ahead of the merge (README, Hub operations: following main).
# After every green check (check.yml) of a pull request into main from this repository, or of a
# push to main, this takes the run's `bundle` (built from one git tree) and publishes:
# - the slave release on the GitHub release tree-<tree>: claudia-tree-<tree>.tar.gz (the whole
#   build) and the same in two, claudia-code-<tree>.tar.gz and claudia-deps-<lockfile hash>.tar.gz
#   (servers download node_modules only when the lockfile changed), and a Mac's node_modules,
#   claudia-deps-<lockfile hash>-darwin-arm64.tar.gz (the check's artifact bundle-darwin-arm64;
#   added to a release made before it was there), each with its cosign keyless signature bundle
#   (<file>.sigstore.json);
# - the hub's image: ghcr.io/<owner>/claudia-hub:tree-<tree>, put together from the bundle by COPY
#   only (deploy/hub.Dockerfile; one with RUN is refused, so none of the bundle's code runs here),
#   signed keyless with the annotation tree=<tree>.
# Both signatures name this workflow on main, which deploy/update.sh and the gate's helper trust.
# The tree is GitHub's record of the checked commit (the run's head commit), never the bundle's
# word; the bundle's tree.txt must say the same. The run's title carries the tree, so the hub can
# tell servers and the gate to fetch it ahead (src/claudia/hub/github.cljs); when main's tree is
# one already published, a merge only swaps folders and restarts.
name: stage
run-name: stage ${{ github.event.workflow_run.head_commit.tree_id }}

on:
  workflow_run:
    workflows: [check]
    types: [completed]

permissions: {}

concurrency:
  group: stage-${{ github.event.workflow_run.head_commit.tree_id }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/claudia-hub
  IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/stage.yml@refs/heads/main
  ISSUER: https://token.actions.githubusercontent.com
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  stage:
    # Green, from this repository (no forks), a PR into main or a push to main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0].base.ref == 'main') ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-26.04
    permissions:
      actions: read     # the check run's artifact
      contents: write   # the release
      packages: write   # push to GHCR
      id-token: write   # cosign keyless signing through GitHub OIDC
    steps:
      # Before The tree: it checks an existing image's signature.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: The tree
        id: tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA" --jq .tree.sha)
          [[ $tree =~ ^[0-9a-f]{40}$ ]] || { echo "no tree for $HEAD_SHA" >&2; exit 1; }
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          if gh release view "tree-$tree" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=done" >> "$GITHUB_OUTPUT"
            if gh release view "tree-$tree" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              grep -q -- '-darwin-arm64\.tar\.gz$'; then
              echo "darwin=done" >> "$GITHUB_OUTPUT"
            fi
          fi
          # Done only when signed as the gate checks it: an image pushed by a run whose signing failed
          # (2026-11-14: Sigstore's log refused once) is pushed and signed again, never left unsigned.
          if cosign verify "$IMAGE:tree-$tree" -a "tree=$tree" \
               --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" >/dev/null 2>&1; then
            echo "image=done" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$IMAGE:tree-$tree" >/dev/null 2>&1; then
            echo "image tree-$tree is there but not signed by stage.yml: pushed and signed again" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "tree $tree (commit $HEAD_SHA)" >> "$GITHUB_STEP_SUMMARY"

      - name: Download the bundle
        if: steps.tree.outputs.release != 'done' || steps.tree.outputs.image != 'done' || steps.tree.outputs.darwin != 'done'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A check run made before check.yml packed it has none: the release goes out without it.
      - name: Download the Mac's node_modules
        if: steps.tree.outputs.darwin != 'done'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-darwin-arm64
          path: dist-darwin
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the bundle
        id: bundle
        if: steps.tree.outputs.release != 'done' || steps.tree.outputs.image != 'done' || steps.tree.outputs.darwin != 'done'
        env:
          TREE: ${{ steps.tree.outputs.tree }}
        run: |
          name="claudia-tree-$TREE.tar.gz"
          mkdir dist/pkg
          tar -xzf "dist/$name" -C dist/pkg --no-same-owner
          [ "$(cat dist/pkg/tree.txt)" = "$TREE" ] || { echo "the bundle's tree.txt is not $TREE" >&2; exit 1; }
          deps=$(cat dist/pkg/deps.txt)
          [[ $deps =~ ^[0-9a-f]{20}$ ]] || { echo "the bundle names no node_modules" >&2; exit 1; }
          want=$(printf '%s\n' "claudia-code-$TREE.tar.gz" "claudia-deps-$deps.tar.gz" "$name" | sort)
          [ "$(ls dist | grep -v '^pkg$' | sort)" = "$want" ] || { echo "the bundle is not $want: $(ls dist)" >&2; exit 1; }
          # The code and the node_modules together are the whole build, file for file.
          mkdir dist/split
          tar -xzf "dist/claudia-code-$TREE.tar.gz" -C dist/split --no-same-owner
          tar -xzf "dist/claudia-deps-$deps.tar.gz" -C dist/split --no-same-owner
          diff -r dist/pkg dist/split > /dev/null || { echo "code + node_modules differ from the whole build" >&2; exit 1; }
          rm -rf dist/split
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          # The Mac's node_modules: from the same lockfile, holding the darwin-arm64 Claude Code.
          mac="dist-darwin/claudia-deps-$deps-darwin-arm64.tar.gz"
          if [ -f "$mac" ]; then
            [ "$(ls dist-darwin)" = "$(basename "$mac")" ] || { echo "the Mac's bundle is not $(basename "$mac"): $(ls dist-darwin)" >&2; exit 1; }
            mkdir dist/mac
            tar -xzf "$mac" -C dist/mac --no-same-owner
            [ "$(cat dist/mac/deps.txt)" = "$deps" ] || { echo "the Mac's node_modules say another lockfile" >&2; exit 1; }
            [ -x dist/mac/node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/claude ] || { echo "the Mac's node_modules hold no darwin-arm64 Claude Code" >&2; exit 1; }
            rm -rf dist/mac
            echo "mac=$mac" >> "$GITHUB_OUTPUT"
          fi
          if grep -qiE '^[[:space:]]*RUN([[:space:]]|$)' dist/pkg/deploy/hub.Dockerfile; then
            echo "deploy/hub.Dockerfile has RUN: refused (the image is put together by COPY only)" >&2; exit 1
          fi
          jq -n --arg v "$(jq -r .version dist/pkg/package.json)" --arg t "$TREE" '{version: $v, tree: $t[0:7]}' \
            > dist/pkg/version.json

      - name: Sign and publish the slave release
        if: steps.tree.outputs.release != 'done'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TREE: ${{ steps.tree.outputs.tree }}
          DEPS: ${{ steps.bundle.outputs.deps }}
          MAC: ${{ steps.bundle.outputs.mac }}
        run: |
          files=()
          for f in "dist/claudia-tree-$TREE.tar.gz" "dist/claudia-code-$TREE.tar.gz" "dist/claudia-deps-$DEPS.tar.gz" ${MAC:+"$MAC"}; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$f"
            files+=("$f" "$f.sigstore.json")
          done
          gh release create "tree-$TREE" --repo "$GITHUB_REPOSITORY" --target "$HEAD_SHA" --prerelease \
            --title "Claudia tree ${TREE::7}" \
            --notes "Slave release of git tree ${TREE} (checked at ${HEAD_SHA}), signed by this repository's stage workflow: the whole build, and the same as its code and its node_modules (by lockfile ${DEPS})." \
            "${files[@]}"
          echo "release: tree-$TREE" >> "$GITHUB_STEP_SUMMARY"

      # A release made before the Mac's node_modules were packed (or by a stage.yml that did not know
      # them) gets them now.
      - name: Add the Mac's node_modules to the release
        if: steps.tree.outputs.release == 'done' && steps.tree.outputs.darwin != 'done' && steps.bundle.outputs.mac != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TREE: ${{ steps.tree.outputs.tree }}
          MAC: ${{ steps.bundle.outputs.mac }}
        run: |
          cosign sign-blob --yes --bundle "$MAC.sigstore.json" "$MAC"
          cosign verify-blob --bundle "$MAC.sigstore.json" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$MAC"
          gh release upload "tree-$TREE" --repo "$GITHUB_REPOSITORY" "$MAC" "$MAC.sigstore.json"
          echo "release: tree-$TREE + $(basename "$MAC")" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.tree.outputs.image != 'done'

      - name: Log in to GHCR
        if: steps.tree.outputs.image != 'done'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the hub's image
        if: steps.tree.outputs.image != 'done'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist/pkg
          file: dist/pkg/deploy/hub.Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:tree-${{ steps.tree.outputs.tree }}
          # Links the package to this repository (its page, its permissions).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.HEAD_SHA }}
          provenance: mode=min
          sbom: true

      - name: Sign the hub's image
        if: steps.tree.outputs.image != 'done'
        env:
          TREE: ${{ steps.tree.outputs.tree }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes -a "tree=$TREE" "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" -a "tree=$TREE" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" > /dev/null
          echo "image: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      # Staged releases of PRs that never merged pile up: those older than 14 days go (with their
      # tags), the newest 10 always stay.
      - name: Drop old staged releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | startswith(\"tree-\"))] | sort_by(.createdAt) | reverse | .[10:][] | select(.createdAt < \"$cutoff\") | .tagName" |
            while read -r tag; do gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true; done
