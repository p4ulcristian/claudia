# Claudia's builds, signed and published ahead of the merge (README, Hub operations: following main).
# After every green check (check.yml) of a pull request into main from this repository, or of a
# push to main, this takes the run's `bundle` (built from one git tree) and publishes:
# - the slave release: claudia-tree-<tree>.tar.gz on the GitHub release tree-<tree>, with its
#   cosign keyless signature bundle (<file>.sigstore.json);
# - the hub's image: ghcr.io/<owner>/claudia-hub:tree-<tree>, put together from the bundle by COPY
#   only (deploy/hub.Dockerfile; one with RUN is refused, so none of the bundle's code runs here),
#   signed keyless with the annotation tree=<tree>.
# Both signatures name this workflow on main, which deploy/update.sh and the gate's helper trust.
# The tree is GitHub's record of the checked commit (the run's head commit), never the bundle's
# word; the bundle's tree.txt must say the same. The run's title carries the tree, so the hub can
# tell servers and the gate to fetch it ahead (src/claudia/hub/github.cljs); when main's tree is
# one already published, a merge only swaps folders and restarts.
name: stage
run-name: stage ${{ github.event.workflow_run.head_commit.tree_id }}

on:
  workflow_run:
    workflows: [check]
    types: [completed]

permissions: {}

concurrency:
  group: stage-${{ github.event.workflow_run.head_commit.tree_id }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/claudia-hub
  IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/stage.yml@refs/heads/main
  ISSUER: https://token.actions.githubusercontent.com
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  stage:
    # Green, from this repository (no forks), a PR into main or a push to main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0].base.ref == 'main') ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    permissions:
      actions: read     # the check run's artifact
      contents: write   # the release
      packages: write   # push to GHCR
      id-token: write   # cosign keyless signing through GitHub OIDC
    steps:
      - name: The tree
        id: tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA" --jq .tree.sha)
          [[ $tree =~ ^[0-9a-f]{40}$ ]] || { echo "no tree for $HEAD_SHA" >&2; exit 1; }
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          if gh release view "tree-$tree" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=done" >> "$GITHUB_OUTPUT"
          fi
          if docker manifest inspect "$IMAGE:tree-$tree" >/dev/null 2>&1; then
            echo "image=done" >> "$GITHUB_OUTPUT"
          fi
          echo "tree $tree (commit $HEAD_SHA)" >> "$GITHUB_STEP_SUMMARY"

      - name: Download the bundle
        if: steps.tree.outputs.release != 'done' || steps.tree.outputs.image != 'done'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the bundle
        if: steps.tree.outputs.release != 'done' || steps.tree.outputs.image != 'done'
        env:
          TREE: ${{ steps.tree.outputs.tree }}
        run: |
          name="claudia-tree-$TREE.tar.gz"
          [ "$(ls dist)" = "$name" ] || { echo "the bundle is not $name: $(ls dist)" >&2; exit 1; }
          mkdir dist/pkg
          tar -xzf "dist/$name" -C dist/pkg --no-same-owner
          [ "$(cat dist/pkg/tree.txt)" = "$TREE" ] || { echo "the bundle's tree.txt is not $TREE" >&2; exit 1; }
          if grep -qiE '^[[:space:]]*RUN([[:space:]]|$)' dist/pkg/deploy/hub.Dockerfile; then
            echo "deploy/hub.Dockerfile has RUN: refused (the image is put together by COPY only)" >&2; exit 1
          fi
          jq -n --arg v "$(jq -r .version dist/pkg/package.json)" --arg t "$TREE" '{version: $v, tree: $t[0:7]}' \
            > dist/pkg/version.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and publish the slave release
        if: steps.tree.outputs.release != 'done'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TREE: ${{ steps.tree.outputs.tree }}
        run: |
          f="dist/claudia-tree-$TREE.tar.gz"
          cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          cosign verify-blob --bundle "$f.sigstore.json" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$f"
          gh release create "tree-$TREE" --repo "$GITHUB_REPOSITORY" --target "$HEAD_SHA" --prerelease \
            --title "Claudia tree ${TREE::7}" \
            --notes "Slave release of git tree ${TREE} (checked at ${HEAD_SHA}), signed by this repository's stage workflow." \
            "$f" "$f.sigstore.json"
          echo "release: tree-$TREE" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.tree.outputs.image != 'done'

      - name: Log in to GHCR
        if: steps.tree.outputs.image != 'done'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the hub's image
        if: steps.tree.outputs.image != 'done'
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: dist/pkg
          file: dist/pkg/deploy/hub.Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:tree-${{ steps.tree.outputs.tree }}
          # Links the package to this repository (its page, its permissions).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.HEAD_SHA }}
          provenance: mode=min
          sbom: true

      - name: Sign the hub's image
        if: steps.tree.outputs.image != 'done'
        env:
          TREE: ${{ steps.tree.outputs.tree }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes -a "tree=$TREE" "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" -a "tree=$TREE" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" > /dev/null
          echo "image: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      # Staged releases of PRs that never merged pile up: those older than 14 days go (with their
      # tags), the newest 10 always stay.
      - name: Drop old staged releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | startswith(\"tree-\"))] | sort_by(.createdAt) | reverse | .[10:][] | select(.createdAt < \"$cutoff\") | .tagName" |
            while read -r tag; do gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true; done
