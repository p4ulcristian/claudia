# The hub's image (deploy/hub.Dockerfile), for the gate: built on main, pushed to GHCR (public) and
# signed keyless with cosign. The gate's update helper (the gate repo's flatcar/claudia-hub/update.sh)
# verifies this workflow's signature, on main, before it runs an image; GitHub's webhook for this run
# finishing is what starts it (README, decision 27).
name: hub-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/p4ulcristian/claudia-hub

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # cosign keyless signing through GitHub OIDC
    steps:
      # Every action is pinned to a commit SHA, not a tag: tags can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short commit
        id: commit
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/hub.Dockerfile
          push: true
          build-args: COMMIT=${{ steps.commit.outputs.short }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

      # A successful `cosign sign` only proves a signature was uploaded. Verify it against the exact
      # identity a deploy trusts: this workflow, on main, issued by GitHub's OIDC provider.
      - name: Verify signature
        if: github.ref == 'refs/heads/main'
        run: |
          cosign verify "${IMAGE}@${{ steps.push.outputs.digest }}" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/hub-image.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "image: ${IMAGE}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
