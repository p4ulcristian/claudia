# The PR check (CLAUDE.md, "How the code is written"): on every pull request and push to main,
# - lint: clj-kondo over src and test, failing on any error (.clj-kondo/config.edn);
# - ratchet: shadowed names and functions over 30 lines may only go down (bin/ratchet.mjs);
# - test: the test build (test/, namespaces ending in -test) on Node;
# - build: all five release builds;
# - bundle: what was built, packed as one tarball keyed by the git tree it was built from (out/,
#   production node_modules for linux-x64, deploy/, package.json, tree.txt), uploaded as the run's
#   artifact `bundle`, and the same node_modules for a Mac (darwin-arm64: the Agent SDK's Claude
#   Code binary is per platform) as the artifact `bundle-darwin-arm64`. stage.yml signs and
#   publishes them once this check is green, so a merge of an up-to-date PR finds its build ready
#   (README, Hub operations: following main).
# A pull request is checked at its head commit (not GitHub's merge preview): the bundle's tree is
# then the head's, which stage.yml checks against GitHub's own record of the run.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  KONDO_VERSION: 2026.05.25
  KONDO_SHA256: ba8742f90555332852a3f63260611ca75cc7ba4e2b6dfe601bf5011bb9402b45

jobs:
  check:
    # Where it runs: pushes to main and pull requests from this repository run on our own
    # runner, label claudia-release-builder (a fenced machine with warm caches: faster, no
    # queue). A pull request from a fork runs on a GitHub-hosted runner, so code nobody here wrote
    # never runs on ours (stage.yml publishes nothing from forks anyway). The runner only builds;
    # stage.yml signs and publishes on GitHub-hosted runners, and this job's token can only read.
    runs-on: >-
      ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
          && 'claudia-release-builder' || 'ubuntu-26.04' }}
    steps:
      # Every action is pinned to a commit SHA, not a tag: tags can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          # Our runner keeps ~/.npm between jobs; uploading it to GitHub's cache would only cost time.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      # shadow-cljs compiles on the JVM.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: clj-kondo (pinned, checksum verified)
        run: |
          zip="clj-kondo-${KONDO_VERSION}-linux-static-amd64.zip"
          curl -fsSL -o "$RUNNER_TEMP/$zip" "https://github.com/clj-kondo/clj-kondo/releases/download/v${KONDO_VERSION}/$zip"
          echo "${KONDO_SHA256}  $RUNNER_TEMP/$zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/kondo"
          echo "$RUNNER_TEMP/kondo" >> "$GITHUB_PATH"

      - name: Lint
        run: clj-kondo --lint src test --fail-level error

      - name: Ratchet
        run: node bin/ratchet.mjs

      - name: Install
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build (host runner front hub web)
        run: |
          npx shadow-cljs release host runner front hub web
          npm run build:web-files

      - name: Bundle
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          mkdir -p dist/pkg
          cp -r out deploy package.json package-lock.json dist/pkg/
          rm -rf dist/pkg/out/test.js dist/pkg/out/test.js.map dist/pkg/out/cljs-runtime
          echo "$tree" > dist/pkg/tree.txt
          # The lockfile's hash names the node_modules, so an update downloads them only when it changes.
          deps=$(sha256sum package-lock.json | cut -c1-20)
          echo "$deps" > dist/pkg/deps.txt
          (cd dist/pkg && npm ci --omit=dev --ignore-scripts --no-audit --no-fund && rm package-lock.json)
          # The whole build (the hub's image; servers that have not updated past the split), and the
          # same split in two: its code (every update, a few MB) and its node_modules.
          tar -czf "dist/claudia-tree-$tree.tar.gz" -C dist/pkg .
          tar -czf "dist/claudia-code-$tree.tar.gz" -C dist/pkg --exclude=./node_modules .
          tar -czf "dist/claudia-deps-$deps.tar.gz" -C dist/pkg ./node_modules ./deps.txt
          ls -l dist/*.tar.gz
          echo "bundle: tree $tree, node_modules $deps" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: dist/claudia-*.tar.gz
          retention-days: 7
          if-no-files-found: error

      # A Mac (deploy/macos) runs the same code with its own node_modules, from the same lockfile:
      # claudia-deps-<lockfile hash>-darwin-arm64. Its own artifact, so a stage.yml that does not
      # know it yet takes `bundle` as before.
      - name: Bundle the Mac's node_modules
        run: |
          deps=$(cat dist/pkg/deps.txt)
          mkdir -p dist/darwin/pkg
          cp package.json package-lock.json dist/darwin/pkg/
          echo "$deps" > dist/darwin/pkg/deps.txt
          (cd dist/darwin/pkg && npm ci --omit=dev --ignore-scripts --no-audit --no-fund --os=darwin --cpu=arm64 && rm package.json package-lock.json)
          test -x dist/darwin/pkg/node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/claude
          tar -czf "dist/darwin/claudia-deps-$deps-darwin-arm64.tar.gz" -C dist/darwin/pkg ./node_modules ./deps.txt
          ls -l dist/darwin/*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-darwin-arm64
          path: dist/darwin/claudia-deps-*-darwin-arm64.tar.gz
          retention-days: 7
          if-no-files-found: error
