<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claudia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  </head>
  <body>
    <script>
      // Set the theme before the first paint, so the page doesn't flash.
      try {
        const t = localStorage.getItem("theme") || "dark";
        document.documentElement.dataset.theme = t === "auto" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : t;
      } catch { document.documentElement.dataset.theme = "dark"; }
    </script>
    <div id="root"></div>
    <script type="module" src="./app.tsx"></script>
  </body>
</html>
